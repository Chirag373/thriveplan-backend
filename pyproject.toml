[project]
name = "thriveplan-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "firebase-admin>=7,<8",
  "requests>=2.32,<3",
  "django-environ>=0.12,<1",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]
